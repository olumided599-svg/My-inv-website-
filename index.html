<!DOCTYPE html>
<html lang="en">
<head>

  <header>

  </header>

    </div>

    <div class="card">
      <h2>Premium Plan</h2>
      <p>Invest $50 - Earn $10 daily</p>
      <button>Invest Now</button>

    <div class="card">
